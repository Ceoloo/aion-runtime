name: CI

# Build + verify the runtime host, then publish the one provider-neutral image
# (ADR-002). aion-infra consumes this image by tag; it never builds the runtime.
on:
  push:
    branches: [main]
    # Release tags build an IMMUTABLE, boot-certified image (see image job).
    tags: ['execution-platform-v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: typecheck · build · portability · acceptance · mission001-proof · mission002-proof · mission003-proof · mission004-proof · mission005-proof · mission006-proof · mission007-proof · mission008-proof · mission009-proof · ie002-proof · platform-v01-cert
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aion_data
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vendor + build @aion/core and @aion/data
        run: node scripts/setup-deps.mjs

      - name: Install
        run: npm install --no-audit --no-fund
        env:
          AION_SKIP_DEPS_SETUP: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Gateway unit proofs (outcomes/sessions + submit concurrency)
        run: npm run test:gateway

      - name: Portability check
        run: npm run portability-check

      - name: Provision least-privilege roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d aion_data -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE aion_migrator LOGIN PASSWORD 'ci_migrator';
          CREATE ROLE aion_app LOGIN PASSWORD 'ci_app';
          GRANT ALL ON SCHEMA public TO aion_migrator;
          ALTER DATABASE aion_data OWNER TO aion_migrator;
          SQL

      - name: Acceptance (migrate → deploy → readiness → smoke)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
        run: npm run acceptance

      - name: Mission 001 proof matrix (PASS A/B/C/D)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8091'
        run: npm run proof:mission001

      - name: Mission 002 proof matrix (Media cross-domain)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8092'
        run: npm run proof:mission002

      - name: Mission 003 attack suite (tenant/domain isolation)
        run: npm run proof:mission003


      - name: Mission 004 proof matrix (orchestration lineage)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8094'
        run: npm run proof:mission004

      - name: Mission 005 proof matrix (economics rollups)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8095'
        run: npm run proof:mission005

      - name: Mission 006 proof matrix (workforce control center)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8096'
        run: npm run proof:mission006

      - name: Mission 007 proof matrix (evals + performance routing)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8097'
        run: npm run proof:mission007

      - name: Mission 008 proof matrix (earned autonomy)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8098'
        run: npm run proof:mission008

      - name: Mission 009 proof matrix (GHL client plane A–J)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8099'
        run: npm run proof:mission009

      - name: IE-002 acceptance matrix (provisioning + activation gate)
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8102'
        run: npm run proof:ie002

      - name: Platform v0.1 multi-domain certification
        env:
          MIGRATION_DATABASE_URL: postgresql://aion_migrator:ci_migrator@localhost:5432/aion_data
          DATABASE_URL: postgresql://aion_app:ci_app@localhost:5432/aion_data
          DATABASE_SSL: 'false'
          GIT_SHA: ${{ github.sha }}
          PORT: '8093'
        run: npm run certify:platform-v01

  image:
    name: build · boot-certify · publish image
    needs: verify
    runs-on: ubuntu-latest
    # Publish on a push to main OR a release-tag push. Never on PRs.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/execution-platform-v'))
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image references
        id: refs
        run: |
          set -eu
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aion-runtime"
          {
            echo "tags<<EOF"
            # The commit-SHA tag is ALWAYS published — the immutable ref
            # aion-infra pins for deploys.
            echo "${repo}:${GITHUB_SHA}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              # `:latest` is convenience metadata only, never a deploy truth
              # (aion-infra §21–22) — it tracks main, not releases.
              echo "${repo}:latest"
            else
              # Release-tag push: also publish the human-readable immutable tag,
              # e.g. …:execution-platform-v0.2.1
              echo "${repo}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build ONCE, load into the local daemon, and prove it boots before a
      # single byte is pushed. CI "build succeeded" is not "artifact deployable".
      - name: Build image (load for boot-certification)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aion-runtime:boot-certify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot-certify (migrate → run → /health/ready) — GATE A
        run: bash scripts/image-boot-check.sh aion-runtime:boot-certify "${GITHUB_SHA}"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-runs from the buildx cache produced above — no rebuild — so only the
      # exact image that passed boot-certification is published.
      - name: Publish certified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
